  function renderRecommendation(rec) {
    const info = METHODS[rec.method_id];
    if (!info) return '';
    
    return `
      <div class="recommendation">
        <div class="rec-header" onclick="this.classList.toggle('open'); this.nextElementSibling.classList.toggle('open')">
          <div class="rec-rank">${rec.rank === 1 ? '🥇' : rec.rank === 2 ? '🥈' : '🥉'}</div>
          <div class="rec-title">
            <div class="rec-name">${info.name}</div>
            <div class="rec-score">Cocok: ${rec.score}% — ${info.gistmom}</div>
          </div>
          <div class="rec-toggle">▼</div>
        </div>
        
        <div class="rec-content">
          <div class="mom-box">
            <strong>Gist:</strong> ${info.whatismom}
          </div>
          
          <div style="margin-bottom:1.5rem;">
            <strong style="color:var(--primary); display:block; margin-bottom:1rem;">🎯 4 Tips Praktis Minggu Ini:</strong>
            ${info.tips.map(t => `
              <div class="tip-card">
                <div class="tip-title">${t.title}</div>
                <div class="tip-content">${t.content}</div>
              </div>
            `).join('')}
          </div>
          
          <div class="tabs">
            <button class="tab-btn active" onclick="switchTab(this, 'qa-${rec.method_id}')">❓ Q&A Ibu</button>
            <button class="tab-btn" onclick="switchTab(this, 'modul-${rec.method_id}')">📖 Modul Lengkap</button>
            <button class="tab-btn" onclick="switchTab(this, 'jadwal-${rec.method_id}')">🗓️ Template Jadwal</button>
            <button class="tab-btn" onclick="switchTab(this, 'checklist-${rec.method_id}')">✅ Checklist Milestone</button>
          </div>

          <div id="qa-${rec.method_id}" class="tab-content active q-and-a">
            ${info.qasom.map(qa => `
              <details>
                <summary>${qa.q}</summary>
                <p>${qa.a}</p>
              </details>
            `).join('')}
          </div>

          <div id="modul-${rec.method_id}" class="tab-content">
            <p><strong>${info.name} — Panduan Lengkap untuk Ibu</strong></p>
            ${info.modul_key_points ? `
              <ul style="margin:1rem 0 1.5rem 1.5rem; padding:0; color:var(--gray-light); line-height:1.8;">
                ${info.modul_key_points.map(p => `<li style="margin-bottom:0.75rem;">${p}</li>`).join('')}
              </ul>
            ` : ''}
          </div>

          <div id="jadwal-${rec.method_id}" class="tab-content">
            <p><strong>Template Jadwal Harian ${info.name}</strong></p>
            ${info.jadwal_checklist ? `
              <div style="margin:1.5rem 0;">
                ${Object.entries(info.jadwal_checklist).map(([usia, phases]) => `
                  <div style="margin-bottom:1.5rem; background:rgba(16,185,129,0.04); padding:1rem; border-radius:8px;">
                    <strong style="color:var(--primary); display:block; margin-bottom:0.75rem;">${usia.replace(/_/g, '-').replace('tahun', 'thn')}</strong>
                    <div style="font-size:0.9rem; color:var(--gray-light); line-height:1.6;">
                      <div style="margin-bottom:0.5rem;"><strong>🌅 Pagi:</strong> ${phases.pagi.map(p => `<div style="margin-left:1rem; margin-bottom:0.3rem;">${p}</div>`).join('')}</div>
                      <div style="margin-bottom:0.5rem;"><strong>☀️ Siang:</strong> ${phases.siang.map(p => `<div style="margin-left:1rem; margin-bottom:0.3rem;">${p}</div>`).join('')}</div>
                      <div><strong>🌙 Sore:</strong> ${phases.sore.map(p => `<div style="margin-left:1rem; margin-bottom:0.3rem;">${p}</div>`).join('')}</div>
                    </div>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>

          <div id="checklist-${rec.method_id}" class="tab-content">
            <p><strong>Milestone Development ${info.name}</strong></p>
            ${info.milestones ? `
              <div style="margin:1.5rem 0;">
                ${Object.entries(info.milestones).map(([usia, milestones]) => `
                  <div style="margin-bottom:1.5rem;">
                    <strong style="color:var(--primary); display:block; margin-bottom:0.75rem;">${usia.replace(/_/g, '-').replace('tahun', 'thn')}</strong>
                    <ul style="margin:0; padding-left:1.5rem; list-style:none; color:var(--gray-light);">
                      ${milestones.map(m => `<li style="margin-bottom:0.75rem; line-height:1.5;">${m}</li>`).join('')}
                    </ul>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        </div>
      </div>
    `;
  }

  function switchTab(btn, contentId) {
    const parent = btn.parentElement;
    parent.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    parent.parentElement.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(contentId).classList.add('active');
  }

  function loadResults() {
    const childData = JSON.parse(sessionStorage.getItem('growaide_child') || '{}');
    const results = JSON.parse(sessionStorage.getItem('growaide_results') || '{}');
    
    if(childData.anak_name) {
      document.getElementById('childName').textContent = `Untuk ${childData.anak_name}`;
    }
    
    if(results.recommendations && results.recommendations.length > 0) {
      const container = document.getElementById('recommendationsContainer');
      container.innerHTML = results.recommendations.map(rec => renderRecommendation(rec)).join('');
    } else {
      document.getElementById('recommendationsContainer').innerHTML = `
        <div style="text-align:center; padding:2rem; background:rgba(16,185,129,0.05); border-radius:12px;">
          <p style="font-size:1.1rem; margin-bottom:1rem;">⏳ Loading rekomendasi...</p>
          <p style="color:var(--gray-light); font-size:0.9rem;">Kalau stuck, <a href="/step2.html" style="color:var(--primary); text-decoration:underline;">mulai dari Step 2 lagi</a></p>
        </div>
      `;
    }
  }
  
  function downloadGuide() {
    alert('📥 Feature coming: Download PDF panduan lengkap');
  }
  
  loadResults();
</script>
